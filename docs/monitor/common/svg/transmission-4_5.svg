<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1150 680" xmlns="http://www.w3.org/2000/svg" style="background-color: #0D1117; font-family: 'Segoe UI', system-ui, sans-serif;">
  <defs>
    <!-- 工业蓝图网格背景 -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262D" stroke-width="1"/>
      <path d="M 150 0 L 0 0 0 150" fill="none" stroke="#30363D" stroke-width="1.5"/>
    </pattern>
    <!-- 发光滤镜 -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 金属渐变质感 -->
    <linearGradient id="metal-linear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#484F58" />
      <stop offset="50%" stop-color="#8B949E" />
      <stop offset="100%" stop-color="#21262D" />
    </linearGradient>
    <radialGradient id="metal-radial" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#8B949E" />
      <stop offset="95%" stop-color="#30363D" />
      <stop offset="100%" stop-color="#161B22" />
    </radialGradient>
    <!-- 箭头标记 -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58A6FF" />
    </marker>
  </defs>

  <!-- 背景底色 + 蓝图网格 -->
  <rect width="1150" height="680" fill="#0D1117" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- ======================== 机械物理结构绘制 ======================== -->
  <!--
    主动轴 (X=350): 小带轮  r=20 (Z1=16)
    从动轴 (X=800): 大带轮  r=90 (Z2=72)
    传动比 i = 90/20 = 4.5 : 1
  -->

  <!-- [底层] 单级同步带闭环（柔性牵引） -->
  <g fill="none" stroke-linejoin="round">
    <path d="M 350 360 L 800 290 A 90 90 0 0 1 800 470 L 350 400 A 20 20 0 0 1 350 360 Z"
          stroke="#161B22" stroke-width="16"/>
    <path d="M 350 360 L 800 290 A 90 90 0 0 1 800 470 L 350 400 A 20 20 0 0 1 350 360 Z"
          stroke="#79C0FF" stroke-width="4" stroke-dasharray="5 4" stroke-opacity="0.5"/>
    <path d="M 350 360 L 800 290 A 90 90 0 0 1 800 470 L 350 400 A 20 20 0 0 1 350 360 Z"
          stroke="#484F58" stroke-width="2"/>
  </g>

  <!-- [顶层] 主动小带轮 r=20 (Z1=10) -->
  <g transform="translate(350, 380)">
    <circle cx="0" cy="0" r="20" fill="url(#metal-radial)"/>
    <circle cx="0" cy="0" r="19" fill="none" stroke="#58A6FF" stroke-width="5" stroke-dasharray="6.28 6.28"/>
    <circle cx="0" cy="0" r="6" fill="#C9D1D9"/>
    <!-- 顺时针旋转指示 -->
    <path d="M -16 -28 A 32 32 0 0 1 28 -16" fill="none" stroke="#58A6FF" stroke-width="3"
          marker-end="url(#arrow-cyan)" stroke-dasharray="4 2"/>
    <!-- 齿数标签 -->
    <rect x="-40" y="40" width="80" height="22" rx="4" fill="#1F6FEB" fill-opacity="0.2" stroke="#58A6FF" stroke-width="1"/>
    <text x="0" y="55" fill="#58A6FF" font-size="13" font-weight="bold" text-anchor="middle">Z1 = 16 齿</text>
  </g>

  <!-- 从动大带轮 r=90 (Z2=45) -->
  <g transform="translate(800, 380)">
    <circle cx="0" cy="0" r="90" fill="url(#metal-radial)" stroke="#58A6FF" stroke-width="2"/>
    <circle cx="0" cy="0" r="83" fill="none" stroke="#21262D" stroke-width="4"/>
    <!-- 辐条（镂空减重） -->
    <path d="M 0 -83 L 0 83 M -83 0 L 83 0 M -59 -59 L 59 59 M -59 59 L 59 -59" stroke="#161B22" stroke-width="12"/>
    <!-- 齿纹装饰圈 -->
    <circle cx="0" cy="0" r="87" fill="none" stroke="#58A6FF" stroke-width="2" stroke-dasharray="6.28 6.28" stroke-opacity="0.5"/>
    <!-- 中心轴孔 -->
    <circle cx="0" cy="0" r="14" fill="#161B22" stroke="#484F58" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#C9D1D9"/>
    <!-- 逆时针旋转指示 -->
    <path d="M 55 -65 A 80 80 0 0 0 -55 -65" fill="none" stroke="#58A6FF" stroke-width="4"
          marker-end="url(#arrow-cyan)"/>
    <text x="-58" y="-95" fill="#58A6FF" font-size="14" font-weight="bold">Z2 = 72 齿</text>
  </g>

  <!-- 传动比中段标识 -->
  <g transform="translate(560, 250)">
    <rect x="-10" y="-15" width="180" height="26" rx="4" fill="#1F6FEB" fill-opacity="0.15" stroke="#58A6FF" stroke-width="1"/>
    <text x="0" y="2" fill="#58A6FF" font-size="13" font-weight="bold">单级减速比 = 72/16 = 4.5 : 1</text>
    <path d="M 80 11 L 80 50" stroke="#58A6FF" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>

  <!-- ======================== HUD 信息面板 ======================== -->
  <!-- 顶部标题 -->
  <g transform="translate(330, 60)">
    <text x="0" y="0" fill="#E6EDF3" font-size="32" font-weight="900" filter="url(#glow-cyan)">单级同步带传动架构图</text>
    <text x="15" y="30" fill="#8B949E" font-size="16" font-weight="bold" letter-spacing="2">总传动链结构：小带轮 → 同步带 → 大带轮</text>
    <line x1="-30" y1="45" x2="490" y2="45" stroke="#1F6FEB" stroke-width="2" />
  </g>

  <!-- 左侧：单级传动参数面板 -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="260" height="180" rx="6" fill="#161B22" fill-opacity="0.85" stroke="#58A6FF" stroke-width="1.5"/>
    <path d="M 0 35 L 260 35" stroke="#58A6FF" stroke-width="1" stroke-opacity="0.5"/>
    <text x="15" y="24" fill="#58A6FF" font-size="15" font-weight="bold" filter="url(#glow-cyan)">[🔗] 单级传动模块</text>
    <text x="15" y="60" fill="#E6EDF3" font-size="13">➤ 传动方式: <tspan fill="#79C0FF">同步带柔性牵引</tspan></text>
    <text x="15" y="82" fill="#E6EDF3" font-size="13">➤ 主动齿数: <tspan fill="#79C0FF">16 齿 (顺时针)</tspan></text>
    <text x="15" y="104" fill="#E6EDF3" font-size="13">➤ 从动齿数: <tspan fill="#79C0FF">72 齿 (逆时针)</tspan></text>
    <text x="15" y="126" fill="#E6EDF3" font-size="13">➤ 同步带型号: <tspan fill="#79C0FF">HTD 3M 圆弧齿</tspan></text>
    <text x="15" y="148" fill="#E6EDF3" font-size="13">➤ 运动学特征: <tspan fill="#79C0FF">传动方向反转</tspan></text>
    <text x="15" y="170" fill="#E6EDF3" font-size="13">➤ 典型机型: <tspan fill="#79C0FF">VX730 中低速款</tspan></text>
    <!-- 指向小带轮虚线 -->
    <path d="M 130 180 L 130 260 L 305 300" fill="none" stroke="#58A6FF" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-cyan)"/>
  </g>

  <!-- 右侧：工况参数面板 -->
  <g transform="translate(860, 40)">
    <rect x="0" y="0" width="260" height="180" rx="6" fill="#161B22" fill-opacity="0.85" stroke="#58A6FF" stroke-width="1.5"/>
    <path d="M 0 35 L 260 35" stroke="#58A6FF" stroke-width="1" stroke-opacity="0.5"/>
    <text x="15" y="24" fill="#58A6FF" font-size="15" font-weight="bold" filter="url(#glow-cyan)">[📊] 运动学参数</text>
    <text x="15" y="60" fill="#E6EDF3" font-size="13">➤ 输入转速 ω₁: <tspan fill="#79C0FF">i × ω₂</tspan></text>
    <text x="15" y="82" fill="#E6EDF3" font-size="13">➤ 输出转速 ω₂: <tspan fill="#79C0FF">云台速度</tspan></text>
    <text x="15" y="104" fill="#E6EDF3" font-size="13">➤ 转速比: <tspan fill="#79C0FF">n₁ / n₂ = 4.5</tspan></text>
    <text x="15" y="126" fill="#E6EDF3" font-size="13">➤ 转矩比: <tspan fill="#79C0FF">T₂ / T₁ ≈ 4.5 (×η)</tspan></text>
    <text x="15" y="148" fill="#E6EDF3" font-size="13">➤ 传动方向: <tspan fill="#79C0FF">主动 CW → 从动 CCW</tspan></text>
    <text x="15" y="170" fill="#E6EDF3" font-size="13">➤ 传动效率 η: <tspan fill="#79C0FF">≈ 0.95 (同步带)</tspan></text>
    <!-- 指向大带轮虚线 -->
    <path d="M 130 180 L 130 260" fill="none" stroke="#58A6FF" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-cyan)"/>
  </g>

  <!-- 底部：总传动比方程结论 -->
  <g transform="translate(250, 580)">
    <rect x="0" y="0" width="650" height="70" rx="8" fill="#1F6FEB" fill-opacity="0.1" stroke="#58A6FF" stroke-width="1"/>
    <text x="325" y="30" fill="#E6EDF3" font-size="16" font-weight="bold" text-anchor="middle" filter="url(#glow-cyan)">总传动比方程式</text>
    <text x="325" y="55" fill="#8B949E" font-size="16" font-weight="bold" text-anchor="middle">
      <tspan fill="#79C0FF">从动齿数 (Z2=72)</tspan> ÷ <tspan fill="#79C0FF">主动齿数 (Z1=16)</tspan> = <tspan fill="#E6EDF3">总减速比 4.5 : 1</tspan>
    </text>
  </g>
</svg>
